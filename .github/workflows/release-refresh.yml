name: Release refresh

# Keeps each product site on its product's latest release (FEAT-016): compares the /release.json
# a site publishes with the latest release of its releases repository and starts the Deploy
# workflow for the sites that differ.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report, start no deploy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-refresh
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Compare and deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/release-refresh.mjs $DRY_RUN
